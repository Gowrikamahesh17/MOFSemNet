gallery_url: "/step6/substructures.json"
gallery_title: "Which chemical fragments sit behind the top fingerprint bits"
finding: >
  The model is mostly a pore-geometry model: two columns give R² 0.72 and the linker chemistry
  adds the rest, which is why the language models add so little. Both embeddings carry real
  chemistry (a graph from real embeddings beats one from random vectors by 0.16 to 0.19 R² for
  ChemBERTa and 0.18 to 0.19 for MolT5), but even correct neighbours do not beat a GNN with no
  edges, and real embeddings do not improve Random Forest (0.874 and 0.884 against 0.883 without).
  MolT5 behaves like ChemBERTa in every analysis. Adaptive conformal intervals reach the 90% target
  on both test sets (90.8% random, 89.9% on Case Study 2's hub set) and widen where the model is
  uncertain (width tracks the error, rank correlation 0.72), which a fixed width does not do for
  large pores. The explained forest uses min_samples_leaf=5 (R² 0.858) because TreeSHAP is
  numerically unreliable on fully grown trees. The intervals and column groups use fingerprint
  features only, so they do not depend on the language model.
  Mapped back to chemistry, the individual fingerprint bits are weak: the single most important bit
  carries about 1% of the reliance, against about 70% for the Largest Free Sphere column, and most of
  the 12 top bits move the prediction by less than 0.1 Å. The two clear effects are an aromatic carbon
  bearing an oxygen (hydroxyl or ether type), which raises the predicted PLD by about 0.3 Å, and an
  imidazole-type ring, which lowers it by about 0.5 Å. Bits are hashed, so several fragments can share
  one bit; the gallery shows the most common one and how many collide.
  More explainers (Step 6b) give a consistent picture for the pore columns and an inconsistent one for the
  fingerprint. TreeSHAP on XGBoost puts 56% on pore geometry (Random Forest 74%); the GCN without edges
  relies mostly on the linker fingerprint (59%), so the networks and the trees use the inputs
  differently even though both reach R² near 0.87 to 0.89. For the GCN with a graph, GNNExplainer puts
  only about 10% of its mask on the node's own features, so that model draws heavily on neighbours, which
  fits the earlier result that a graph does not help. LIME is the weak one: its local models explain
  little (R² about 0.3), its top-5 features overlap SHAP's by only 15 to 19%, and it names the pore
  column as the top feature in about half the MOFs where SHAP does in about 90%. LIME gets the sign and
  size right for the dominant pore column in single examples but scatters weight over fingerprint bits
  that the forest does not use, which is a known instability with about a thousand sparse binary inputs.
  The SHAP results are the ones to rely on.
  For GNNs with a graph (Step 6c, 30 test MOFs, CS2 graph with k=3) the explanation depends on the
  model. The plain GCN, which scores only R² 0.66, puts 81% of its SHAP attribution on its neighbours'
  features rather than the MOF's own, which is the mechanism behind a graph hurting: the answer is built
  from similar linkers, not from this MOF's own pore geometry. GraphSAGE (46% on neighbours) and the
  residual GCN (15%) lean on neighbours far less and score 0.87, in line with the no-edge GNN. The
  GraphSAGE here is PyG's SAGEConv, which keeps a separate weight for the node itself, so its score is
  not comparable with the earlier GraphSAGE graph runs. LIME on every GNN repeats its pattern from the
  trees: low-fidelity local models (R² about 0.2), top-5 overlap with SHAP of only 12 to 13%, and weight
  mostly on fingerprint bits. SHAP for the graph models is an expected-gradients approximation with an
  additivity gap of 0.13 to 0.33 Å.
