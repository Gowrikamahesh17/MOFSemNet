gallery_url: "/step6/substructures.json"
gallery_title: "Which chemical fragments sit behind the top fingerprint bits"
finding: >
  The model is mostly a pore-geometry model: two columns give R² 0.72 and the linker chemistry
  adds the rest, which is why the language models add so little. Both embeddings carry real
  chemistry (a graph from real embeddings beats one from random vectors by 0.16 to 0.19 R² for
  ChemBERTa and 0.18 to 0.19 for MolT5), but even correct neighbours do not beat a GNN with no
  edges, and real embeddings do not improve Random Forest (0.874 and 0.884 against 0.883 without).
  MolT5 behaves like ChemBERTa in every analysis. Adaptive conformal intervals reach the 90% target
  on both test sets (90.8% random, 89.9% on Case Study 2's hub set) and widen where the model is
  uncertain (width tracks the error, rank correlation 0.72), which a fixed width does not do for
  large pores. The explained forest uses min_samples_leaf=5 (R² 0.858) because TreeSHAP is
  numerically unreliable on fully grown trees. The intervals and column groups use fingerprint
  features only, so they do not depend on the language model.
  Mapped back to chemistry, the individual fingerprint bits are weak: the single most important bit
  carries about 1% of the reliance, against about 70% for the Largest Free Sphere column, and most of
  the 12 top bits move the prediction by less than 0.1 Å. The two clear effects are an aromatic carbon
  bearing an oxygen (hydroxyl or ether type), which raises the predicted PLD by about 0.3 Å, and an
  imidazole-type ring, which lowers it by about 0.5 Å. Bits are hashed, so several fragments can share
  one bit; the gallery shows the most common one and how many collide.
  More explainers (Steps 6b and 6c) first looked as if the GCN used its inputs differently from the trees,
  but that was an aggregation artefact. Summing each column's mean |SHAP| inflates the fingerprint group
  (1,024 columns that partly cancel within a MOF). As each group's net contribution per MOF, Random Forest
  (88%), XGBoost (81%) and the GCN without edges (79%) all rest mostly on pore geometry, and expected
  gradients agrees with an exact Shapley calculation over the three groups (correlation 0.92 to 0.99).
  For GNNs with a graph (CS2, Black Hole pruned CS2, ChemBERTa and MolT5 semantic graphs; 3 seeds) the plain GCN,
  which scores only R² 0.58 to 0.62 on the full graphs, puts 81 to 84% of its attribution on its neighbours' features and
  uses its own pore geometry less (61 to 64% net). Black Hole pruning (30% retention) lowers that to 56% and lifts the GCN to
  R² 0.72, so pruning helps by making the GCN lean on its neighbours less. GraphSAGE (31 to 47% on neighbours) and
  the residual GCN (16 to 23%) lean on neighbours far less, rely on pore geometry as the no-edge models do (76 to 79%)
  and score 0.86 to 0.88, in line with a GNN without edges. That is the mechanism behind a graph hurting: the answer
  is built from similar linkers, not from this MOF's own pore geometry. MolT5 and ChemBERTa graphs behave alike.
  The GraphSAGE here is PyG's SAGEConv, which keeps a separate weight for the node
  itself, so its score is not comparable with the earlier GraphSAGE graph runs. LIME is the weak
  method: its local models explain little (R² about 0.2), its top-5 features overlap SHAP's by only 11
  to 19%, and it names the pore column as the top feature in about a quarter of GNN explanations where
  SHAP does in about 80%. The SHAP results are the ones to rely on.
  SHAP on the 768 embedding dimensions shows the embedding's contribution is spread thin: the group is 34% of the
  summed importance but 13 to 14% as a net contribution, and the top 15 dimensions carry only about 15%. Some dimensions
  track simple chemistry (ring counts, polarity; |Spearman| up to 0.72), yet twelve standard RDKit descriptors explain none of
  the embedding's net contribution (cross-validated R² about 0), while that contribution follows the true PLD (Spearman 0.25
  for ChemBERTa, 0.32 for MolT5). So the embeddings carry pore-relevant information that is not one of the usual descriptors,
  which is consistent with them helping a graph's neighbour choice but adding nothing to a model that already has the pore columns.
