title: "Step 4 — Sparsification Comparison"
status: done
summary: >
  Applied Black Hole, random, and k-center sampling to all three graph types at 30% and
  50% retention, with one fixed test set held constant across every method and graph type.
retention_shown: "30%"
columns: ["Graph", "Method", "Nodes", "Edges", "Isolated"]
