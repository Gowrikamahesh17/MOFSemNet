finding: >
  Two bugs found and fixed: k-center was silently returning fewer nodes than requested
  once it ran out of genuinely distinct fingerprint vectors (only 3,047 of 14,296 MOFs
  have one) — fixed to always honor the retention budget. Its notion of "diversity" also
  didn't match the graph it was pruning — it now uses fingerprint space, embedding space,
  or both, to match the graph type. Separately, Black Hole leaves 24–41% of surviving
  nodes fully isolated and retains fewer edges than random sampling at matched node
  counts — not necessarily worse, since it targets high-gravity nodes specifically, but
  worth watching once Step 5 reports actual prediction accuracy.
