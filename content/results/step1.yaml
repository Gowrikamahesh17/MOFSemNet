title: "Step 1 — Baseline Reproduction"
status: done
summary: >
  Ported the working, tested pipeline from the prior Case Study and re-ran it on the real
  14,296-MOF dataset. The first four numbers are Case Study 2's reported results (Table 3, one
  seed, its hub test set of 664 high-gravity MOFs). The last two are this thesis's reproduction on
  the same hub test set with 5 seeds.
stats:
  - label: "Random Forest MAE (Case Study 2)"
    value: "0.525 Å"
  - label: "Random Forest RMSE (Case Study 2)"
    value: "1.001 Å"
  - label: "Random Forest R² (Case Study 2)"
    value: "0.893"
    emphasis: true
  - label: "Best GNN R² (Case Study 2, GraphSAGE + Black Hole 30%)"
    value: "0.687"
    emphasis: false
  - label: "Random Forest R², reproduced (5 seeds)"
    value: "0.888"
    emphasis: true
  - label: "Same GNN, reproduced (5 seeds)"
    value: "0.751"
finding: >
  Random Forest beats the best GNN by a wide margin on R² — the exact failure mode this
  thesis's semantic graph is meant to address. The reproduction matches Case Study 2 for Random
  Forest (0.888 against 0.893, MAE 0.549 Å, RMSE 1.072 Å on the 664-MOF hub set) and gives the GNN
  a higher score when averaged over five seeds (0.751 against 0.687 from one seed).
