title: "Step 5 — Model Comparison"
status: done
summary: >
  Compared Random Forest, MLP and k-NN (no graph) against GCN, GraphSAGE and a residual GCN
  (graph) on every combination of graph type, neighbours (k), sparsification method and
  retention, with ChemBERTa and MolT5 embeddings, 5 seeds each (0 to 4). Two test sets: a
  random 15% (2,144 MOFs) and Case Study 2's harder hub set (680 MOFs). About 3,000 runs. A follow-up added
  XGBoost and LightGBM, richer inputs (RDKit descriptors, count fingerprints), a log target, a pore-column
  ablation, graph variants, ensembles and a fix to the GNN training (a further 2,500 runs), and a regression
  MOFGalaxyNet baseline for the comparison with MOFSemNet.
headline: "0.897"
headline_label: "Best single score (test R², random test set): LightGBM with count fingerprints, MACCS keys and RDKit descriptors. Plain Random Forest 0.883, plain XGBoost 0.893"
