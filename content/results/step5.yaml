finding: >
  Random Forest on plain fingerprints reproduces Case Study 2 (0.888 against 0.893, same hub test
  set). Gradient boosting is not a consistent improvement (XGBoost beats it on the random test set,
  0.893 against 0.883, and loses on the hub set), richer inputs add at most a few thousandths, and the
  best single scores (0.897 and 0.905) are within a few hundredths of the plain forest. The first GNN
  results were under-trained: every run used all 200 epochs because the target was on the wrong scale.
  Standardising the target and the continuous inputs lifts the no-edge GNN from 0.84 to 0.874 and
  leaves the conclusion unchanged: a GNN with no edges is as good as any GNN with a graph, and
  the plain GCN on a graph still scores 0.64. Without the two pore columns every model falls to about
  0.6 and no graph variant (de-duplicated, descriptor-space, Black Hole pruned) beats the same GNN
  with no edges. Against the regression MOFGalaxyNet baseline, the semantic layer gives no consistent
  gain (GCN worse in 59 of 60 random-set comparisons, GraphSAGE better on average). The GNN accuracy
  gap to the best tree model shrank from about 0.05 to 0.023. Fewer neighbours help (GCN on the Case Study 2 graph:
  k=3 0.622, k=5 0.575, k=10 0.527). Neither ChemBERTa nor MolT5 improves on fingerprints
  (Random Forest rows differ by under 0.01, and the sign flips between test sets). Black Hole
  beats random pruning on the hub test set (+0.06 R², better in 81% of comparisons) but not on
  a random one (+0.009); the hub set is built from the same gravity ranking, so that advantage
  may be biased in its favour. The GNN result against Case Study 2 improved from 0.687 (one
  seed) to 0.751 (five seeds). Not run: GAT, other Black Hole weights, 10 seeds, a formal significance test.
