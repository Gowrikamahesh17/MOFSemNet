title: "Step 5 — Model Comparison"
status: done
summary: >
  Compared Random Forest, MLP and k-NN (no graph) against GCN, GraphSAGE and a residual GCN
  (graph) on every combination of graph type, neighbours (k), sparsification method and
  retention, with ChemBERTa and MolT5 embeddings, 5 seeds each (0 to 4). Two test sets: a
  random 15% (2,144 MOFs) and Case Study 2's harder hub set (680 MOFs). About 3,000 runs.
headline: "0.883"
headline_label: "Best model: Random Forest on fingerprint features (test R², random test set; 0.888 on the hub set)"
stats:
  - label: "Random Forest R² (hub set)"
    value: "0.888"
    emphasis: true
  - label: "GNN with no edges R²"
    value: "0.840"
  - label: "Best GNN with a graph R²"
    value: "0.745"
  - label: "Case Study 2 best GNN R²"
    value: "0.687"
columns: ["Model and setting", "Random test set R²", "Hub test set R²"]
rows:
