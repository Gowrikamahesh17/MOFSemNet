ahead_of_schedule_note: >
  The exposé's own milestones targeted ChemBERTa embeddings complete by mid-November 2026
  and all graph types built by mid-December 2026. Both landed in the same working session,
  along with Step 4's full sparsification sweep — roughly a month ahead of the registered
  plan.
  Step 5 (both language models, two test sets, about 3,000 runs) and the Step 6
  analysis (both language models) then finished on 2026-11-20, one to three months ahead of their registered windows.
  Scope notes: beyond the registered guardrails, a residual GCN (a diagnostic with a gated graph term), XGBoost and
  LightGBM (stronger non-graph baselines) and a regression MOFGalaxyNet baseline were added; the GNN training was corrected
  after the first runs turned out to be under-trained, and the Step 6 explainers were extended to LIME, GNNExplainer and the
  embedding dimensions. The web console (WP8) was brought up to date on 2026-11-22; it will be revised once more for the final write-up.
