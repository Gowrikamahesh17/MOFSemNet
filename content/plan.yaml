# Research questions and scope guardrails, shown on /plan. Pulled directly from the thesis
# expose so this page never drifts from what's actually been registered/approved.

context: >
  A prior Case Study reproduced MOFGalaxyNet and the Black Hole sparsification strategy to
  predict Pore Limiting Diameter (PLD) of Metal-Organic Frameworks from a Tanimoto
  fingerprint-similarity graph combined with a Graph Neural Network. Across a 2,004-MOF and
  a 14,296-MOF dataset, non-graph baselines (Random Forest, k-NN) outperformed every GNN
  configuration tested, because the similarity graph was built from information already
  present in each node's own feature vector. Message passing re-derived a smoothed version
  of existing information rather than adding genuinely new relational signal.

thesis_statement: >
  This thesis tests whether a similarity graph built from a different kind of information
  — fixed embeddings from a pretrained chemical language model computed over each MOF's
  linker SMILES — can give a GNN a genuine advantage over non-graph baselines on the same
  continuous PLD target. A second, related question is whether Black Hole sparsification,
  reused unmodified from the prior Case Study, preserves predictive performance on the
  resulting semantic and hybrid graphs when pruned by 30% and 50%, and whether it continues
  to outperform random and k-center sampling baselines at matched retention levels.

research_questions:
  - id: rq1
    text: "Do pretrained chemical-language representations add predictive signal beyond conventional molecular fingerprints, for MOF linker chemistry specifically?"
    answer: "No, on current evidence. Neither ChemBERTa nor MolT5 adds a reliable gain over fingerprints: Random Forest scores 0.883 / 0.888 on fingerprints, 0.876 / 0.897 with ChemBERTa and 0.882 / 0.895 with MolT5 (random / hub test set), and the sign flips between test sets. Embeddings alone score 0.42 to 0.48. They do carry real chemistry (a graph from them beats one from random vectors) and a pore-size-related signal that twelve standard RDKit descriptors do not explain, but nothing usable beyond the fingerprint and the pore columns."
  - id: rq2
    text: "Do semantic or hybrid similarity graphs built from such representations improve PLD prediction compared with the original fingerprint graph and with non-graph baselines?"
    answer: "No. Semantic and hybrid graphs score within about 0.01 to 0.03 of the fingerprint graph, and no graph beats the same GNN with no edges, even after tuning every model on the validation split (best no-edge GNN 0.882, best GNN with a graph 0.879; 0.84 before the training fix and tuning), which in turn is below the best tuned tree model (ExtraTrees 0.900 on the random test set, 0.904 on the hub set). Against a regression MOFGalaxyNet baseline (the same GNN on the Case Study 2 graph without language models) the semantic layer gives no consistent gain. Without the two pore-geometry columns, where R² falls to about 0.6, graphs still add nothing."
  - id: rq3
    text: "Can Black Hole sparsification preserve the predictive performance of fingerprint, semantic, and hybrid graphs while reducing their computational cost?"
    answer: "Only partly. Pruning raises the score of a weak graph (Case Study 2 graph, GCN: 0.64 to 0.72 at 30% retention), but random pruning does about as well on a random test set, so the gain comes from removing edges. SHAP shows why: pruning lowers the share of the GCN's attribution that sits on neighbours from 81% to 56%. No pruned graph beats a GNN with no edges, except a residual GCN on Case Study 2's hub test set (+0.009 over an untuned no-edge GNN, with a possible selection bias; the gain disappears once the no-edge GNN is tuned too)."
  - id: rq4
    text: "Does Black Hole sparsification outperform random and k-center sampling at matched retention levels, on these new graph types, as it does on the original fingerprint graph?"
    answer: "Depends on the test set. On a random test set Black Hole is not clearly better than random pruning (+0.009 R²). On Case Study 2's hub test set it is better by +0.06 (81% of comparisons), but that set is built from the same gravity ranking, so the advantage may be biased. k-center is the weakest and least stable."

guardrails:
  - "One dataset: the large, 14,296-MOF set"
  - "One prediction target: continuous Pore Limiting Diameter"
  - "One primary language model: ChemBERTa, with MolT5 as a secondary comparison"
  - "At most two GNN architectures: GCN, GraphSAGE"
  - "Two pruning levels: 30% and 50% retention"
  - "No literature mining, generative design, data augmentation, or additional target properties"

negative_result_framing: >
  Consistent with the prior Case Study's own framing, a negative result here — the semantic
  or hybrid graph again failing to outperform Random Forest or MLP — is treated as a
  complete and useful scientific outcome, not a failed thesis. It would extend the Case
  Study's finding into a second, materially different information source, strengthening the
  evidence for exactly which conditions cause a MOF similarity graph to add predictive
  value and which do not.
